name: Bump the rustyfi pin

# Moves the `rustyfi/` submodule to the tip of the typesetter's `main` and
# commits the new gitlink. A submodule pin is SOURCE, not build output, which is
# why this workflow is allowed to write to the repository while `pages.yml` is
# not.
on:
  schedule:
    # Daily. Weekly was the alternative and is worse here: the playground is the
    # public face of a typesetter whose `main` moves in bursts, and a week-old
    # pin turns "it does not work in the playground" into a bug report about a
    # fix that already landed. A no-op run is one `git ls-remote`, so the cost
    # of checking daily is a few seconds.
    #
    # 03:17 UTC rather than the top of the hour: GitHub queues scheduled
    # workflows and explicitly warns that runs scheduled on the hour are the
    # most delayed.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # To commit and push the moved gitlink.
  contents: write
  # To dispatch `pages.yml` below — a push made with GITHUB_TOKEN does not
  # trigger `on: push` workflows, so without this the pin would move and the
  # site would never be rebuilt from it.
  actions: write

# Serialize, so a manual run during the cron window cannot race it into two
# commits of the same pin.
concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Move the submodule to rustyfi's main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No `submodules:` — the gitlink is rewritten in the INDEX below, so
          # the submodule's contents are never needed and cloning the whole
          # typesetter to move a 40-byte pointer would be pure waste.
          fetch-depth: 1

      - name: Resolve rustyfi's main and move the pin
        id: pin
        run: |
          set -euo pipefail
          # The HTTPS URL, not the SSH one in `.gitmodules`: rustyfi is public,
          # so an anonymous `ls-remote` needs no credentials and this does not
          # depend on actions/checkout's SSH-to-HTTPS rewriting.
          target=$(git ls-remote https://github.com/yasuo-ozu/rustyfi.git refs/heads/main | cut -f1)
          if [ -z "$target" ]; then
            echo "::error::rustyfi has no refs/heads/main"
            exit 1
          fi
          current=$(git rev-parse HEAD:rustyfi)
          echo "current=$current"
          echo "target=$target"
          if [ "$current" = "$target" ]; then
            echo "The pin is already current; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `update-index --cacheinfo` writes the gitlink directly, which is the
          # only way to stage a submodule commit that is not checked out.
          git update-index --add --cacheinfo "160000,$target,rustyfi"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rustyfi: move the pinned submodule to ${target:0:12}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # `workflow_dispatch` is one of the two events GitHub exempts from the
      # "GITHUB_TOKEN does not trigger workflows" rule, so this is what actually
      # rebuilds and redeploys the site after a bump. If the new pin does not
      # build, `pages.yml`'s self-test fails there and the live site is left
      # untouched.
      - name: Rebuild the playground from the new pin
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
